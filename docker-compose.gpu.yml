# rescue-pose — 기존 NVIDIA GPU override 명령 호환용.
#
# GPU 예약과 YOLO 가중치 캐시는 기본 docker-compose.yml에 있다. 이 파일은 기존 두 파일 실행
# 명령을 유지하면서 YOLO_DEVICE=cuda:0만 명시적으로 강제한다.
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# 기본 compose만 실행해도 GPU가 할당된다. **Linux + NVIDIA Driver +
# nvidia-container-toolkit** 호스트 전용이다.

services:
  backend:
    environment:
      # 기존 override 실행의 fail-fast 동작을 보존한다.
      YOLO_DEVICE: cuda:0
